<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>FitnessWorld — Reset password</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<main class="auth-page">
  <div class="card form-card auth-card">
    <a class="brand" href="/login"><span class="brand-mark">FW</span><span>FitnessWorld</span></a>
    <h1>Reset Password</h1>
    <form data-auth="forgot" data-api="/api/auth/forgot-password" novalidate>
      <label>Email address<input name="email" type="email" autocomplete="email" required></label>
      <div id="msg" class="notice" role="alert" hidden></div>
      <button class="btn btn-primary btn-full" type="submit">Send Reset Link</button>
    </form>
    <p class="auth-foot"><a href="/login">Back to Login</a></p>
  </div>
</main>
<script src="/auth.js"></script>
</body>
</html>
