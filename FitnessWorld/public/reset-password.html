<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>FitnessWorld — New password</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<main class="auth-page">
  <div class="card form-card auth-card">
    <a class="brand" href="/login"><span class="brand-mark">FW</span><span>FitnessWorld</span></a>
    <h1>New Password</h1>
    <form data-auth="reset" data-api="/api/auth/reset-password" novalidate>
      <label>New password<span class="pw-wrap"><input name="password" type="password" autocomplete="new-password" required><button class="pw-toggle" type="button" aria-pressed="false">Show</button></span></label>
      <label>Confirm password<span class="pw-wrap"><input name="confirmPassword" type="password" autocomplete="new-password" required><button class="pw-toggle" type="button" aria-pressed="false">Show</button></span></label>
      <div id="msg" class="notice" role="alert" hidden></div>
      <button class="btn btn-primary btn-full" type="submit">Update Password</button>
    </form>
    <p class="auth-foot"><a href="/login">Back to Login</a></p>
  </div>
</main>
<script src="/auth.js"></script>
</body>
</html>
